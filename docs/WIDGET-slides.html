# 這是什麼？

ESM 商品推薦輪播 **Widget**，用兩行就能掛上：

```js
await import('https://ts-inf-product-carousel-component.vercel.app/inf-product-carousel-widget.js');
window.InfFitsProductCarousel.mount({ brand, GA4Key, carousels });
```

| 項目 | 說明 |
| :--- | :--- |
| 腳本 | `inf-product-carousel-widget.js` |
| 入口 | `window.InfFitsProductCarousel.mount(config)` |
| Custom Element | `<inf-product-carousel-widget>` |
| 渲染 | Shadow DOM（自行載入 jQuery／Swiper；有 `GA4Key` 時載入 gtag） |

支援兩種型態，**一次 mount 可同時掛**：

| `carousel.type` | 說明 |
| :--- | :--- |
| `product` | 嵌入頁面指定容器 |
| `popup` | 左下角浮動彈窗 |

> 與舊版 `inf-product-carousel-component.js` **互不依賴**（不同 tag，可同頁並存）。舊檔維持不動；新整合建議走 Widget。

---

# 系統架構圖

![Widget 架構圖](#arch-diagram)

## 讀圖重點

1. **Host Page** 兩行：`import` → `mount(config)`。
2. **Widget Runtime** 建立 Custom Element，Shadow DOM 渲染 product／popup。
3. **APIs**：GetItems（品牌設定）→ recom_product（推薦）→ localStorage 快取。
4. **追蹤**：商品點擊並行打 GA4（有 `GA4Key`）與 `mkt_click_action_record`。

---

# 兩行快速開始

```js
await import('https://ts-inf-product-carousel-component.vercel.app/inf-product-carousel-widget.js');

window.InfFitsProductCarousel.mount({
  brand: 'DES',
  GA4Key: 'G-XXXXXXXXXX',
  carousels: [
    {
      type: 'popup',
      showPositionId: { bottom: 'popupProductContent' },
      brandConfig: {
        DisplayMode: 'SaleRate',
        CarouselButton: true,
        RecommendMode: 'bhv',
        CarouselLayout: 2.5,
        Title: '您可能會喜歡',
        Location: 'bottom',
        status: true
      }
    },
    {
      type: 'product',
      showPositionId: {
        top: 'infFitsHeader',
        bottom: 'infFitsFooter'
      }
    }
  ]
});
```

本機亦可用：`await import('./inf-product-carousel-widget.js')`。  
示範頁：`demo-widget.html`。

頁面需先有掛載容器（`id` 與 `showPositionId` 一致）：

```html
<div id="infFitsHeader"></div>
<div id="infFitsContent"><!-- 主內容 --></div>
<div id="infFitsFooter"></div>
```

---

# 整合時序（總覽）

![Widget mount 時序](#seq-mount)

## 流程說明

1. **頁面 → Widget**：`await import(widget.js)` 載入 ESM。
2. **頁面 → Widget**：呼叫 `InfFitsProductCarousel.mount(config)`。
3. **Widget → DOM**：依 `carousel`／`carousels` 建立 `<inf-product-carousel-widget>`，寫入 `config` attribute。
4. **Widget → API**：product 打品牌設定 `GetItems`；再拉推薦 `recom_product`。
5. **互動 → GA4**：有 `GA4Key` 時，商品／箭頭／標題導覽各點一次只打一筆事件。
6. **互動 → 後端**：僅商品點擊另 POST `mkt_click_action_record`（與 GA4 並行）。

---

# mount 行為規則

1. **必須**提供 `carousel` 或**非空** `carousels`，否則 `throw`。
2. 有 `carousel` 時只初始化該筆（即使也有 `carousels`）。
3. 僅有 `carousels` 時展開為多個實例。
4. 依 `type` + `showPositionId` 產生 `data-instance-key`，相同 key 不重複建立。
5. 先 append 到 `body`，再依品牌 `Location` 移到目標容器。

回傳值：單一輪播為 Custom Element；多個為陣列。

```js
{
  brand: string,       // 品牌代碼
  GA4Key: string,      // 不傳或 '' 則不追蹤
  carousel: { ... },   // 單筆；有值時優先
  carousels: [ ... ]   // 多筆；未傳 carousel 時展開
}
```

---

# 頂層參數

| 參數 | 型別 | 說明 |
| :--- | :--- | :--- |
| `brand` | `string` | 品牌代碼，用於品牌設定 API 與推薦 API |
| `GA4Key` | `string` | GA4 Measurement ID；空則不載入 gtag、不發事件 |
| `carousel` | `object` | 單一輪播 |
| `carousels` | `object[]` | 多個輪播；與 `carousel` 二擇一（`carousel` 優先） |

> Widget **不自動猜** brand／Measurement ID；缺關鍵設定會明確失敗。

---

# carousel 常用參數

| 參數 | 型別 | 說明 |
| :--- | :--- | :--- |
| `type` | `'product'` \| `'popup'` | 輪播型態 |
| `showPositionId` | `{ top?, bottom? }` | 掛載容器 DOM id |
| `skuContent` | `string` | `'shopline_sku'`／`'app91_sku'`／直接 PID；未傳則自動判斷 |
| `series_in` / `series_out` | `string` | 系列白／黑名單（JSON 字串） |
| `bid` | `object` | 體型／試穿參數（SIZEAI） |
| `brandConfig` | `object` | 覆寫後端品牌設定 |
| `customEdm` | `array` | 自訂商品；有值優先於 API |
| `recommendMode` | `string` | 如 `'bhv,corr,sp_atc,sp_trans'` |
| `displayMode` | `string` | `SaleRate`／`SocialProofNum` 等 |
| `hide_size` / `hide_discount` | `boolean` | 隱藏尺寸／折扣 |
| `arrowPosition` | `'center'` \| `'none'` | 箭頭；`none` 改用標題旁導覽 |
| `autoplay` | `boolean` | 自動輪播 |

### `type: 'product'`

- 呼叫 `POST …/mkt_brand_config_proc/GetItems`
- 有本地 `brandConfig` 則優先
- 推薦 URL：`DABE` 或有 `series_*` → stock；其餘 → alpha_bhv

### `type: 'popup'`

- 建立 `#infPopupproductCarousel`
- 需 `brandConfig.status === true`
- `autoShow`：`true` 自動顯示；`false` 需 `showPopup()`
- 推薦 endpoint：`HTTP_pidinfo_cdp_product_recommendation`

---

# brandConfig

| 欄位 | 對應 | 說明 |
| :--- | :--- | :--- |
| `Title` / `Description` | 標題／描述 | 顯示文案 |
| `DisplayMode` | `displayMode` | `SaleRate`／`SocialProofNum`… |
| `RecommendMode` | `recommendMode` | `bhv`、`bhv,corr`… |
| `CarouselButton` | `arrowPosition` | `true`→center；`false`→none |
| `CarouselLayout` | 桌面張數 | 數字 |
| `Location` | 上下掛載 | `'top'`／`'bottom'` |
| `status` | 是否啟用 | `false` 不初始化 |
| `autoShow` | popup 自動顯示 | 僅 popup |

```js
brandConfig: {
  DisplayMode: 'SaleRate',
  CarouselButton: true,
  RecommendMode: 'bhv',
  CarouselLayout: 2.5,
  Title: '您可能會喜歡',
  Location: 'bottom',
  status: true,
  autoShow: true
}
```

商品卡會帶 `data-event-recom`，決定 GA4 事件名前綴。

---

# GA4 事件總表

前提：與 `brand` 同層傳入非空 `GA4Key`。每次點擊只發送 **1** 次；後綴目前為 `A`。

| 使用者行為 | 事件名稱 | event_label | value |
| :--- | :--- | :--- | :--- |
| 載入 gtag | `page_view` | — | — |
| 點商品（無 recom） | `click_embedded_itemA` | `Title: {標題}` | 連結長度 |
| 行為／關聯／SP | `{bhv\|corr\|sp_atc\|sp_trans}_click_embedded_itemA` | 同上 | 同上 |
| 桌面左／右箭 | `…arrow_leftA`／`…arrow_rightA` | `arrow-left`／`right` | `10` |
| 標題上一／下一頁 | `…title_nav_prevA`／`…nextA` | `title-nav-prev`／`next` | `10` |

| 條件 | 顯示 | 事件 |
| :--- | :--- | :--- |
| 寬度 ≥ 768 且 `arrowPosition === 'center'` | 側箭頭 | arrow_* |
| 否則 | 標題導覽 | title_nav_* |

箭頭／標題導覽**不會**打後端點擊 API。

---

# 後端點擊與 Popup API

僅「點擊商品」另 POST `https://api.inffits.com/mkt_click_action_record/`：

| 欄位 | 說明 |
| :--- | :--- |
| `recom_loc` | `popup` 或 `embed` |
| `recom_type` | 同 `data-event-recom` |
| `action_*` | link／名稱／pid |

### Popup 全域 API

| API | 說明 |
| :--- | :--- |
| `window.showPopup()` | 顯示；`autoShow === false` 時會先載入 |
| `window.closePopup()` | 關閉 |
| `window.resetRecom(newBid?)` | 重拉推薦，可覆寫 `bid` |

```js
window.resetRecom({ HV: '25.5', WV: '0', Gender: 'F', Brand: 'CLARKS' });
window.showPopup();
```

輔助：`debugCarousel()`、`cleanupInfCarouselCache()`（快取前綴 `inf_widget_carousel_cache_`）。

# 完整範例與 FAQ

### 僅 product

```js
await import('https://ts-inf-product-carousel-component.vercel.app/inf-product-carousel-widget.js');
window.InfFitsProductCarousel.mount({
  brand: 'DES',
  GA4Key: 'G-G3WD6KWQG4',
  carousel: {
    type: 'product',
    hide_size: true,
    showPositionId: { top: 'infFitsHeader', bottom: 'infFitsFooter' }
  }
});
```

### FAQ

- **沒畫面？** 查容器 id、`status`、popup 是否要手動 `showPopup`、`hasValidPopupData`
- **關追蹤？** 不傳或空 `GA4Key`
- **指定商品？** `skuContent` 設成 PID 字串
- **重複 mount？** 同 `type + showPositionId` 回傳既有實例
- **同頁舊新？** 可並存，但勿同時掛兩套 popup

  </script>

  <script>
    function escapeHtml(s){
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function parseMarkdown(md){
      const lines = String(md || '').replace(/\r\n/g,'\n').split('\n');
      let html = '';
      let i = 0;
      let inCode = false;
      let codeLang = '';
      let codeBuf = [];
      let parBuf = [];
      let listType = null;
      let tableRows = [];

      function inline(text){
        let t = escapeHtml(text);
        t = t.replace(/`([^`]+)`/g, (_,c)=>`<code>${c}</code>`);
        t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,alt,src)=>{
          const s = String(src);
          if (s.startsWith('#seq-') || s.startsWith('#arch-')) {
            return `<!--SEQ:${s.slice(1)}-->`;
          }
          return `<img alt="${alt}" src="${src}" />`;
        });
        return t;
      }

      function flushCode(){
        if (!inCode) return;
        html += `<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`;
        inCode = false; codeLang = ''; codeBuf = [];
      }
      function flushList(){
        if (!listType) return;
        html += listType === 'ul' ? '</ul>' : '</ol>';
        listType = null;
      }
      function flushPar(){
        if (!parBuf.length) return;
        html += `<p>${inline(parBuf.join(' '))}</p>`;
        parBuf = [];
      }
      function flushTable(){
        if (!tableRows.length) return;
        const rows = tableRows.map(r => r.split('|').slice(1,-1).map(c => c.trim()));
        tableRows = [];
        if (rows.length < 2) return;
        const head = rows[0];
        const body = rows.slice(2); // skip separator
        html += '<table><thead><tr>' + head.map(c=>`<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
        body.forEach(r => {
          html += '<tr>' + r.map(c=>`<td>${inline(c)}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table>';
      }

      while (i < lines.length){
        const line = lines[i];
        if (line.startsWith('```')){
          flushPar(); flushList(); flushTable();
          if (!inCode){ inCode = true; codeLang = line.slice(3).trim(); codeBuf = []; }
          else flushCode();
          i++; continue;
        }
        if (inCode){ codeBuf.push(line); i++; continue; }

        if (/^\|/.test(line) && line.includes('|',1)){
          flushPar(); flushList();
          tableRows.push(line);
          i++; continue;
        } else {
          flushTable();
        }

        if (/^>\s?/.test(line)){
          flushPar(); flushList();
          html += `<blockquote><p>${inline(line.replace(/^>\s?/,''))}</p></blockquote>`;
          i++; continue;
        }
        if (/^#{1,3}\s/.test(line)){
          flushPar(); flushList();
          const m = line.match(/^(#{1,3})\s+(.*)$/);
          const level = m[1].length;
          html += `<h${level}>${inline(m[2])}</h${level}>`;
          i++; continue;
        }
        if (/^[-*]\s+/.test(line)){
          flushPar();
          if (listType !== 'ul'){ flushList(); html += '<ul>'; listType = 'ul'; }
          html += `<li>${inline(line.replace(/^[-*]\s+/,''))}</li>`;
          i++; continue;
        }
        if (/^\d+\.\s+/.test(line)){
          flushPar();
          if (listType !== 'ol'){ flushList(); html += '<ol>'; listType = 'ol'; }
          html += `<li>${inline(line.replace(/^\d+\.\s+/,''))}</li>`;
          i++; continue;
        }
        if (!line.trim()){
          flushPar(); flushList();
          i++; continue;
        }
        flushList();
        parBuf.push(line.trim());
        i++;
      }
      flushCode(); flushPar(); flushList(); flushTable();

      // inject SVG templates for <!--SEQ:seq-xxx-->
      html = html.replace(/<!--SEQ:(seq-[a-z0-9-]+)-->/g, (_, id) => {
        const tpl = document.getElementById('svg-' + id);
        return tpl ? tpl.innerHTML : '';
      });
      return html;
    }

    function splitSlides(md){
      return String(md || '').split(/\n---\n/).map(s => s.trim()).filter(Boolean);
    }

    function slideTitleFromMarkdown(md){
      const m = String(md || '').match(/^#\s+(.+)$/m);
      return m ? m[1].replace(/[*`]/g,'').trim() : 'Untitled';
    }

    const decks = [
      { id: 'widget', name: 'Widget 整合說明', mdEl: 'md_widget' }
    ];

    const slides = [];
    decks.forEach(deck => {
      const raw = document.getElementById(deck.mdEl)?.textContent || '';
      splitSlides(raw).forEach((md, idx) => {
        slides.push({
          deckId: deck.id,
          deckName: deck.name,
          md,
          title: slideTitleFromMarkdown(md),
          indexInDeck: idx + 1
        });
      });
    });

    let index = 0;
    const tocEl = document.getElementById('toc');
    const slideContent = document.getElementById('slideContent');
    const progressBar = document.getElementById('progressBar');
    const pageLabel = document.getElementById('pageLabel');
    const deckLabel = document.getElementById('deckLabel');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    function buildToc(){
      tocEl.innerHTML = '';
      let currentDeck = null;
      let list = null;
      slides.forEach((s, i) => {
        if (s.deckId !== currentDeck){
          currentDeck = s.deckId;
          const sec = document.createElement('div');
          sec.className = 'toc__section';
          sec.innerHTML = `<span>${escapeHtml(s.deckName)}</span><span class="toc__badge">${slides.filter(x=>x.deckId===s.deckId).length}</span>`;
          tocEl.appendChild(sec);
          list = document.createElement('div');
          list.className = 'toc__list';
          tocEl.appendChild(list);
        }
        const item = document.createElement('div');
        item.className = 'toc__item' + (i === index ? ' is-active' : '');
        item.innerHTML = `<div class="toc__index">${String(s.indexInDeck).padStart(2,'0')}</div><div class="toc__label">${escapeHtml(s.title)}</div>`;
        item.addEventListener('click', () => setIndex(i));
        list.appendChild(item);
      });
    }

    function setIndex(next){
      index = Math.max(0, Math.min(slides.length - 1, next));
      render();
    }

    function render(){
      const s = slides[index];
      slideContent.innerHTML = parseMarkdown(s.md);
      pageLabel.textContent = `${index + 1} / ${slides.length}`;
      deckLabel.textContent = s.deckName;
      progressBar.style.width = `${((index + 1) / slides.length) * 100}%`;
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === slides.length - 1;
      [...tocEl.querySelectorAll('.toc__item')].forEach((el, i) => {
        el.classList.toggle('is-active', i === index);
      });
      history.replaceState(null, '', `#${index + 1}`);
      document.getElementById('slide').scrollTop = 0;
    }

    btnPrev.addEventListener('click', () => setIndex(index - 1));
    btnNext.addEventListener('click', () => setIndex(index + 1));
    window.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault(); setIndex(index + 1);
      }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault(); setIndex(index - 1);
      }
      if (e.key === 'Home') setIndex(0);
      if (e.key === 'End') setIndex(slides.length - 1);
    });

    buildToc();
    const hash = Number((location.hash || '').replace('#',''));
    setIndex(Number.isFinite(hash) && hash >= 1 ? hash - 1 : 0);
  </script>
